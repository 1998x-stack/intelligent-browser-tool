# Example Squid ACL policy. Replace example.com before using.
# Browser clients live on the docker-internal 172.30.90.0/24 network.
http_port 3128
acl browser_clients src 172.30.90.0/24
acl allowed_hosts dstdomain example.com
acl Allowed_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT
acl private_v4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl private_v6 dst ::1/128 fc00::/7 fe80::/10 ::ffff:0:0/96
http_access deny !browser_clients
http_access deny !Allowed_ports
http_access deny CONNECT !SSL_ports
http_access deny private_v4
http_access deny private_v6
http_access allow browser_clients allowed_hosts
http_access deny all
cache deny all
via off
forwarded_for delete
