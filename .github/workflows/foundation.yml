name: Foundation verification

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
                - name: Install project and test dependencies
        run: python -m pip install -e ".[test,browser,search]"
      - name: Syntax check
        run: python -m compileall -q browser_engine.py crawler.py url_queue.py content_extractor.py url_policy.py main.py
      - name: Installed CLI and legacy entry smoke
        run: |
          intelligent-browser --help
          python main.py --help
      - name: Unit and offline integration tests
        run: cd tests && PYTHONPATH=.. python -m pytest -q test_v01_foundation.py test_pr2_conflict_regression.py
