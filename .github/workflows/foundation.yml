name: Foundation verification

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Syntax check
        run: python -m compileall -q browser_engine.py crawler.py url_queue.py content_extractor.py url_policy.py main.py
      - name: Unit and offline integration tests
        run: python -m pytest -q tests/
