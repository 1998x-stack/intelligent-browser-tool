name: Evidence Radar V0.2-B local workspace verification
on:
  push:
    paths:
      - 'research_workspace/**'
      - 'apps/evidence-demo/**'
      - 'tests/test_research_workspace*.py'
      - 'pyproject.toml'
      - '.github/workflows/research-workspace.yml'
      - 'docs/V0.2_B_IMPLEMENTATION.md'
  pull_request:
    paths:
      - 'research_workspace/**'
      - 'apps/evidence-demo/**'
      - 'tests/test_research_workspace*.py'
      - 'pyproject.toml'
      - '.github/workflows/research-workspace.yml'
      - 'docs/V0.2_B_IMPLEMENTATION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-and-unit:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test requirements
        run: python -m pip install -e '.[test]'
      - name: Compile all new backend modules
        run: python -m compileall -q research_workspace
      - name: Installed CLI and first-run smoke
        run: |
          evidence-radar-local --help
          intelligent-browser --help
      - name: Deterministic extractor, lease, recovery, API and security tests
        run: python -m pytest -q tests/test_research_workspace.py
      - name: Offline demo remains unchanged
        run: python -m unittest discover -s tests -p 'test_evidence_demo_static.py' -v
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package and Selenium
        run: python -m pip install -e '.[test,browser]'
      - name: Local API + real Chrome integration, exports, deletion, mobile
        run: python -m unittest discover -s tests -p 'test_research_workspace_browser.py' -v
  frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check apps/evidence-demo/src/live.js
          node --check apps/evidence-demo/src/model.js
          node --check apps/evidence-demo/src/app.js
          npm --prefix apps/evidence-demo test
