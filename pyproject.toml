[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-browser-tool"
version = "0.1.0"
description = "Intent-driven web crawler with resumable frontier and browser adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "loguru>=0.7",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "trafilatura>=1.6",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
browser = ["selenium>=4.15", "webdriver-manager>=4.0"]
search = ["duckduckgo-search>=6.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
intelligent-browser = "crawler:main"

[tool.setuptools]
py-modules = [
  "browser_engine", "config", "content_analyzer", "content_extractor",
  "crawler", "file_namer", "intent_analyzer", "llm_client", "logger_config",
  "frontier_state", "main", "openai_client", "proxy_manager", "report_generator", "run",
  "search_engine", "storage_manager", "url_policy", "url_queue", "utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
